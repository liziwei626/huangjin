# 评分分析的标的（live 为实时价，history 为日线）
analysis:
  history_days: 260
  rsi_period: 14
  weights:
    metal: { valuation: 30, rsi: 24, trend: 16, ratio: 12, volatility: 8, momentum: 10 }
    equity: { valuation: 30, rsi: 25, trend: 20, volatility: 10, momentum: 15 }
  thresholds:
    strong: 75
    buy: 65
    small: 55
    watch: 45
  assets:
    - key: au_cn
      name: 国内黄金 Au99.99
      kind: metal_gold
      unit: 元/克
      live: { source: sina, symbol: gds_AU9999 }
      history: { source: sina_inner, symbol: AU0 }
    - key: ag_cn
      name: 国内白银 Ag(T+D)
      kind: metal_silver
      unit: 元/千克
      live: { source: sina, symbol: gds_AGTD }
      history: { source: sina_inner, symbol: AG0 }
    - key: au_intl
      name: 国际黄金 COMEX
      kind: metal_gold
      unit: 美元/盎司
      live: { source: sina, symbol: hf_GC }
      history: { source: sina_global, symbol: GC }
    - key: ag_intl
      name: 国际白银 COMEX
      kind: metal_silver
      unit: 美元/盎司
      live: { source: sina, symbol: hf_SI }
      history: { source: sina_global, symbol: SI }
    - key: stock_sd
      name: 山东黄金(600547)
      kind: equity
      unit: 元/股
      live: { source: tencent, symbol: sh600547 }
      history: { source: sina_stock, symbol: sh600547 }
    - key: etf_gold
      name: 黄金ETF华安(518880)
      kind: fund
      unit: 元/份
      live: { source: tencent, symbol: sh518880 }
      history: { source: sina_stock, symbol: sh518880 }

notify:
  # always = 每个时段都推送；signal = 仅在评分达到 buy 阈值或信号发生变化时推送
  slots:
    morning: always
    noon: signal
    close: always
    evening: always
  # 也可以在 config 中直接填写（不建议提交到公开仓库，推荐使用环境变量）
  channels:
    pushplus: []
    serverchan: []
    wxpusher:
      app_token: ""
      uids: []
      topic_ids: []
    wecom: []
